# ===================================================================
# Smart Pharmacy Supply Chain System - Application Configuration
# ===================================================================

server.port=8080

# -------------------------------------------------------------------
# Primary Database: MySQL 8.0 / 5.7 Configuration
# If MySQL is installed and running, uncomment below or run standard:
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Active Profile: local (Uses H2 In-Memory DB with zero setup if desired)
# To switch to H2 for instant demo without MySQL setup:
#   java -jar app.jar --spring.profiles.active=local
# -------------------------------------------------------------------
spring.profiles.active=local

# Logging configuration
logging.level.com.pharmacy.supplychain=INFO
logging.level.org.springframework.web=INFO
